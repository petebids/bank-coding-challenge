services:
  postgresql:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  mock-vendor-api:
    build:
      context: .
      dockerfile: mock-vendor-comission-quote-api/Dockerfile
    environment:
      PORT: 4000
      VENDOR_API_KEY: ${VENDOR_API_KEY:-dev-secret-key}
    ports:
      - "4000:4000"

  temporal-worker:
    build:
      context: .
      dockerfile: temporal-worker/Dockerfile
    depends_on:
      - temporal
      - mock-vendor-api
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      VENDOR_API_URL: http://mock-vendor-api:4000
      VENDOR_API_KEY: ${VENDOR_API_KEY:-dev-secret-key}

volumes:
  temporal-postgres:
